services:
  db:
    image: postgres:14
    container_name: postgres_cli
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the root .env}
    volumes:
      - local_cli_data:/var/lib/postgresql/data
      - ./prep/init-scripts:/docker-entrypoint-initdb.d # hadi blassa fin postgress ki rani scripts li fiha automaticment

  db-ui:
    image: dpage/pgadmin4
    container_name: pg-admin
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - local_pg_admin_data:/var/lib/pgadmin
    depends_on:
      - db

  airflow:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        exec airflow standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/airflow
      AIRFLOW_CONN_POSTGRES_DATASTORE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      PYTHONPATH: /opt/airflow
    volumes:
      - ../dags:/opt/airflow/dags
      - ../include:/opt/airflow/include
      - ../src:/opt/airflow/src
      - ../logs:/opt/airflow/logs
      - ../plugins:/opt/airflow/plugins
      - ../data:/opt/airflow/data
      - ../reports:/opt/airflow/reports
    ports:
      - "${AIRFLOW_PORT}:8080"
    depends_on:
      - db


volumes:
  local_pg_admin_data:
  local_cli_data:




